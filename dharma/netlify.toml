# ============================================================
# DHARMA BOOKS PRO - NETLIFY EDGE & HIGH-PERFORMANCE CONFIG
# ============================================================

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"

# Runs the Google Sheets backup once a day automatically (see
# netlify/functions/daily-backup.ts). Requires GOOGLE_SERVICE_ACCOUNT_EMAIL,
# GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY, and GOOGLE_SHEETS_SPREADSHEET_ID to be
# set in Netlify's environment variables — without them this function exits
# early and logs a warning, it does not fail the deploy.
[functions."daily-backup"]
  schedule = "0 20 * * *"

# Netlify Serverless Function API Redirect
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Single Page Application SPA Redirect
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Immutable Long-Term Caching & Compression for Static JS/CSS Bundles
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"
    X-Content-Type-Options = "nosniff"

# Compression & Caching for Media, Fonts and Images
[[headers]]
  for = "*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.jpg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.webp"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.svg"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Vary = "Accept-Encoding"

# Global Security & HTML Cache Revalidation
[[headers]]
  for = "/*"
  [headers.values]
    Vary = "Accept-Encoding"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), microphone=(self), geolocation=(), payment=(self)"
